<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kotak biru</title>
    <style>
        .container {
            display: flex;
            gap: 40px;
            padding: 20px;
        }

        .box {
            width: 150px; height: 150px;
            background-color: blue;
            color: aliceblue;

            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box">1</div>
        <div class="box">2</div>
        <div class="box">3</div>
    </div>
</body>
</html>
