<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Button Book Now</title>
    <style>
        .btn-book {
            background-color: #3B3DA1;
            color: whitesmoke;
            font-size: 20px;
            font-weight: bold;
            padding: 12px 80px;
            border: none;
            border-radius: 8px;
        }

        .btn-book:hover {
            background-color: #2c2e80;
        }
    </style>
</head>
<body>
    <button class="btn-book">Book Now!</button>
</body>
</html>
