<!doctype html>
<html>
  <head>
    <title>Uppercase Heading & Capitalize paragraf</title>
    <style>
        h1 {
            text-transform: uppercase;
        }

        p {
            text-transform: capitalize;
        }
    </style>
  </head>
  <body>
    <h1>Judul Artikel</h1>
    <p>Paragraf ini harus kapital</p>
    <p>paragraf kedua artikel</p>
  </body>
</html>
