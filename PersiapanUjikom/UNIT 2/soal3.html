<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to Bali</title>
    <style>
        .image-kontainer {
            position: relative;
            width: 100%;
            margin: 0 auto;
        }

        .image-kontainer img {
            width: 100%;
            height: auto;
            display: block;
        }

        .teks-overlay {
            position: absolute;
            top: 45%;
            left: 2%;
            font-size: 28px;
            color: whitesmoke;
        }
    </style>
</head>
<body>
    <div class="image-kontainer">
        <img src="image.png" alt="Pemandangan Pantai Bali">
        <div class="teks-overlay">Welcome to Bali</div>
    </div>
</body>
</html>
